<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OLFATI · Acompanhamento de Carreira Técnica</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  color-scheme: light;
  --surface-1:      #fcfcfb;
  --surface-2:      #ffffff;
  --page:           #f4f4f1;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --muted:          #898781;
  --grid:           #e1e0d9;
  --baseline:       #c3c2b7;
  --border:         rgba(11,11,11,0.10);
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
  --series-5: #e87ba4; --series-6: #008300; --series-7: #4a3aa7; --series-8: #e34948;
  --good: #0ca30c; --warning: #b8790f; --serious: #c85a34; --critical: #d03b3b;
  --radius: 10px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--page);color:var(--text-primary);}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}
.hidden{display:none !important;}

/* ---------- Login ---------- */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.login-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:32px;max-width:400px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,0.06);}
.login-card h1{font-size:20px;margin:0 0 4px;}
.login-card .sub{color:var(--text-secondary);font-size:13px;margin:0 0 24px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:5px;}
.field select,.field input{width:100%;padding:9px 10px;border:1px solid var(--baseline);border-radius:7px;font-size:14px;background:var(--surface-1);color:var(--text-primary);}
.btn{padding:9px 16px;border-radius:7px;border:1px solid var(--baseline);background:var(--surface-1);font-size:13px;font-weight:600;color:var(--text-primary);}
.btn:hover{background:var(--grid);}
.btn-primary{background:var(--series-1);border-color:var(--series-1);color:#fff;width:100%;padding:11px;font-size:14px;}
.btn-primary:hover{background:#2568bd;}
.login-note{margin-top:16px;font-size:11.5px;color:var(--muted);line-height:1.5;background:var(--page);padding:10px 12px;border-radius:7px;}

/* ---------- App shell ---------- */
#app{min-height:100vh;}
header.topbar{background:var(--surface-2);border-bottom:1px solid var(--border);padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20;}
.brand{font-weight:700;font-size:15px;letter-spacing:.2px;flex:none;}
.brand span{color:var(--series-1);}
.tabs{display:flex;gap:4px;flex:1 1 auto;flex-wrap:wrap;min-width:0;}
.tab-btn{border:none;background:transparent;padding:8px 12px;border-radius:7px;font-size:13px;color:var(--text-secondary);font-weight:600;white-space:nowrap;}
.tab-btn.active{background:var(--page);color:var(--text-primary);}
.tab-btn:hover{color:var(--text-primary);}
.who{display:flex;align-items:center;gap:10px;font-size:13px;flex:none;margin-left:auto;}
.who .name{font-weight:600;}
@media (max-width:640px){
  header.topbar{padding:10px 14px;}
  .tabs{order:3;flex-basis:100%;border-top:1px solid var(--grid);padding-top:8px;margin-top:2px;}
  .who{margin-left:0;}
}
.badge{padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;color:#fff;}
.badge.junior{background:var(--series-4);color:#1a1200;}
.badge.pleno{background:var(--series-1);}
.badge.senior{background:var(--series-7);}
main{max-width:1180px;margin:0 auto;padding:22px;}
.panel-title{display:none;}
.tabpanel{display:none;}
.tabpanel.active{display:block;}

/* ---------- generic cards / grid ---------- */
.grid{display:grid;gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-2{grid-template-columns:1fr 1fr;}
@media (max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-2{grid-template-columns:1fr;}}
.card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
.card h3{margin:0 0 12px;font-size:13px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.4px;}
.stat{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;}
.stat-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.section{margin-bottom:22px;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
.section-head h2{font-size:16px;margin:0;}

/* progress bars */
.progress-wrap{background:var(--grid);border-radius:20px;height:10px;overflow:hidden;margin:6px 0;}
.progress-fill{height:100%;border-radius:20px;background:var(--series-1);transition:width .3s;}
.progress-fill.good{background:var(--good);}
.progress-fill.warn{background:var(--warning);}
.progress-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);}

/* tables */
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--grid);white-space:nowrap;}
th{color:var(--text-secondary);font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;cursor:pointer;user-select:none;}
th:hover{color:var(--text-primary);}
tbody tr:hover{background:var(--page);}
.table-wrap{overflow-x:auto;}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;}
.pill.good{background:rgba(12,163,12,0.12);color:var(--good);}
.pill.warn{background:rgba(184,121,15,0.14);color:var(--warning);}
.pill.bad{background:rgba(208,59,59,0.12);color:var(--critical);}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
.dot.good{background:var(--good);}.dot.warn{background:var(--warning);}.dot.bad{background:var(--critical);}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.toolbar select,.toolbar input{padding:7px 9px;border:1px solid var(--baseline);border-radius:7px;font-size:12.5px;background:var(--surface-1);}

.checklist-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--grid);}
.checklist-item:last-child{border-bottom:none;}
.check-icon{width:20px;height:20px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:700;margin-top:1px;}
.check-icon.ok{background:var(--good);}
.check-icon.pending{background:var(--baseline);color:var(--text-secondary);}
.checklist-item .ci-title{font-size:13px;font-weight:600;}
.checklist-item .ci-sub{font-size:12px;color:var(--muted);margin-top:2px;}

.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end;}
@media (max-width:900px){.form-grid{grid-template-columns:repeat(2,1fr);}}
.form-grid .field label{font-size:11px;}

.empty-state{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;}

.chip{display:inline-block;background:var(--page);border:1px solid var(--border);padding:2px 8px;border-radius:6px;font-size:11px;color:var(--text-secondary);margin-right:4px;}
.note-box{background:var(--page);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--text-secondary);line-height:1.5;}
.danger-text{color:var(--critical);}
.link-btn{background:none;border:none;color:var(--series-1);font-weight:600;font-size:12.5px;padding:0;}
hr.sep{border:none;border-top:1px solid var(--grid);margin:16px 0;}
.small{font-size:11.5px;color:var(--muted);}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--page);padding:1px 5px;border-radius:4px;font-size:12px;}
.mapping-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;padding:6px 0;}
.preview-table{max-height:220px;overflow:auto;border:1px solid var(--grid);border-radius:8px;}
canvas{max-width:100%;}
.close-x{background:none;border:none;font-size:16px;color:var(--muted);}
</style>

<body>

<!-- ================= LOGIN ================= -->
<div id="loginScreen">
  <div class="login-card">
    <h1>OLFATI <span>·</span> Acompanhamento Técnico</h1>
    <p class="sub">Plano de carreira — Técnicos em Manutenção</p>
    <div class="field">
      <label>E-mail</label>
      <input type="email" id="loginEmail" placeholder="seu@email.com" autocomplete="username">
    </div>
    <div class="field">

</div>

<!-- ================= APP ================= -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand">OLFATI <span>·</span> Carreira</div>

      <button class="btn" onclick="logout()">Sair</button>
    </div>
  </header>
  <main id="mainArea"></main>
</div>

<script>
/* =====================================================================
   ESTADO GLOBAL (em memória — sem localStorage)
===================================================================== */
const CATEGORICAL = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#4a3aa7','#e34948'];

/* URL do CSV publicado do Google Sheets usado para contar atendimentos por técnico.
   Esta tela só CONTA linhas por técnico/mês (usa apenas as colunas "Colaborador" e
   "Data da tarefa" do CSV; qualquer outra coluna presente é ignorada pelo código).
   IMPORTANTE: por decisão explícita do responsável pelo projeto, esta URL aponta para
   a aba BASE_QUESTIONARIO publicada por inteiro (não a versão filtrada PAINEL_TECNICOS),
   o que deixa CPF/CNPJ e dados de cliente publicamente acessíveis a quem tiver o link,
   mesmo esse app não exibindo essas colunas. Deixe vazio para desativar esta aba. */
const ATENDIMENTOS_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS2DCfw84Cs_7pXYf-QUqNcJM5m-dW39T_W7BZXsD_AJ7UmVbrJhmFep2hCwWUFQTZ95ZKW6KeJEooV/pub?gid=136073013&single=true&output=csv';
const ATENDIMENTOS_AUTO_REFRESH_MS = 5 * 60 * 1000; // 5 minutos

function defaultNiveis(){
  return {
    junior: {key:'junior', nome:'Técnico Júnior', ordem:1, salarioBase:2050, valorEquip:0.80,
      meta:600, bonusMeta:100, supermeta:650, bonusSupermeta:200, cicloMeses:3, proximo:'pleno',
      criterios:{minMetaVezes:1, minSupermetaVezes:1, maxPenalidadePerc:7}},
    pleno: {key:'pleno', nome:'Técnico Pleno', ordem:2, salarioBase:2332, valorEquip:0.90,
      meta:750, bonusMeta:150, supermeta:800, bonusSupermeta:250, cicloMeses:6, proximo:'senior',
      criterios:{minMetaVezes:2, minSupermetaVezes:3, maxPenalidadePerc:5}},
    senior: {key:'senior', nome:'Técnico Sênior', ordem:3, salarioBase:2650, valorEquip:1.00,
      meta:900, bonusMeta:200, supermeta:950, bonusSupermeta:300, cicloMeses:null, proximo:null,
      criterios:null}
  };
}

const TIPOS_MODERADO = ["Não abrir e encerrar jornada","Não realizar a conferência de caixa","Desvio de rota não justificado",
  "Falta de identificação do equipamento","Limpeza inadequada do equipamento","Uso indevido de recursos e equipamentos corporativos",
  "Não manter a higiene da frota","Deixar de finalizar atendimentos no sistema","Deixar de entregar folders de apresentação",
  "Deixar de cumprir com todas as etapas de relatórios do sistema"];
const TIPOS_GRAVE = ["Não atender cliente em vermelho","Não atender cliente de reclamação","Não atender clientes de instalação",
  "Não realizar troca de pilha","Falta injustificada ao trabalho","Recebimento de advertência formal","Desvio de qualidade no atendimento",
  "Não prestar contas em caso de adiantamento financeiro","Desvios de conduta grave","Perder ferramentas de serviço",
  "Não retornar à empresa ao final da rota em horário de expediente","Receber advertência verbal"];

function genSenha(){
  const chars='ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
  let s=''; for(let i=0;i<8;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }

function defaultUsuarios(){
  const arr=[{id:'admin', tipo:'admin', nome:'Administrador', login:'admin', senha:'admin123', ativo:true}];
  for(let i=1;i<=8;i++){
    arr.push({id:'tec'+i, tipo:'tecnico', nome:'Técnico '+i, login:'tecnico'+i, senha:genSenha(),
      nivel:'junior', ativo:true, dataAdmissao: todayISO(), cicloInicio: todayISO()});
  }
  return arr;
}

const state = {
  niveis: defaultNiveis(),
  penalidades: { moderada:15, grave:30, modoBonus:'substituir' }, // substituir | somar
  usuarios: defaultUsuarios(),
  atendimentos: [], // {id, tecnicoId, data(ISO), equipamento, origem}
  infracoes: [],    // {id, tecnicoId, data, tipo, categoria, valor, gerouAdvertencia}
  session: null,    // usuario logado
  mesRef: todayISO().slice(0,7),
  sortPainel: {col:'equipamentos', dir:'desc'},
  filtroPainel: {nivel:'', tecnico:''},
  activeTab: null,
  pendingImport: null,
  atendimentosSheet: { linhas: [], headers: [], atualizadoEm: null, carregando: false, erro: '' },
  tecnicosOrigem: null // 'supabase' | 'ficticio' — setado ao carregar o app como admin
};

/* =====================================================================
   HELPERS DE CÁLCULO
===================================================================== */
function tecnicos(){ return state.usuarios.filter(u=>u.tipo==='tecnico'); }
function getUsuario(id){ return state.usuarios.find(u=>u.id===id); }
function nivelDe(u){ return state.niveis[u.nivel]; }

function monthKey(iso){ return iso.slice(0,7); }
function fmtMoney(v){ return 'R$ ' + (v||0).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtMonthLabel(mk){
  const [y,m]=mk.split('-'); const meses=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return meses[parseInt(m,10)-1]+'/'+y;
}
function daysInMonth(mk){ const [y,m]=mk.split('-').map(Number); return new Date(y,m,0).getDate(); }

function atendimentosDoMes(tecnicoId, mk){
  return state.atendimentos.filter(a=>a.tecnicoId===tecnicoId && monthKey(a.data)===mk);
}
function qtdAtendimentosMes(tecnicoId, mk){ return atendimentosDoMes(tecnicoId, mk).length; }

function infracoesDoMes(tecnicoId, mk){
  return state.infracoes.filter(i=>i.tecnicoId===tecnicoId && monthKey(i.data)===mk);
}

function produtividadeMes(tecnicoId, mk){
  const u=getUsuario(tecnicoId), nv=nivelDe(u);
  return qtdAtendimentosMes(tecnicoId, mk) * nv.valorEquip;
}

function bonusMes(tecnicoId, mk){
  const u=getUsuario(tecnicoId), nv=nivelDe(u);
  const qtd = qtdAtendimentosMes(tecnicoId, mk);
  const bateuMeta = qtd >= nv.meta, bateuSuper = qtd >= nv.supermeta;
  let bonus=0, status='abaixo';
  if(bateuSuper){
    status='supermeta';
    bonus = state.penalidades.modoBonus==='somar' ? (nv.bonusMeta+nv.bonusSupermeta) : nv.bonusSupermeta;
  } else if(bateuMeta){
    status='meta'; bonus = nv.bonusMeta;
  }
  return {bonus, status, bateuMeta, bateuSuper, qtd};
}

function penalidadesValorMes(tecnicoId, mk){
  return infracoesDoMes(tecnicoId, mk).reduce((s,i)=>s+i.valor,0);
}
function percentualPenalidadesMes(tecnicoId, mk){
  const qtdAt = qtdAtendimentosMes(tecnicoId, mk);
  const qtdInf = infracoesDoMes(tecnicoId, mk).length;
  if(qtdAt===0) return 0;
  return (qtdInf/qtdAt)*100;
}

function remuneracaoEstimadaMes(tecnicoId, mk){
  const u=getUsuario(tecnicoId), nv=nivelDe(u);
  const prod = produtividadeMes(tecnicoId, mk);
  const {bonus} = bonusMes(tecnicoId, mk);
  const pen = penalidadesValorMes(tecnicoId, mk);
  return nv.salarioBase + prod + bonus - pen;
}

/* --- ciclo de avaliação / promoção --- */
function addMonths(iso, n){
  const d=new Date(iso+'T00:00:00'); d.setMonth(d.getMonth()+n); return d.toISOString().slice(0,10);
}
function mesesEntre(iso1, mk){ // conta meses do cicloInicio até o mk (inclusive) como lista de monthKeys
  const start = iso1.slice(0,7);
  const out=[]; let [y,m]=start.split('-').map(Number);
  const [ey,em]=mk.split('-').map(Number);
  while(y<ey || (y===ey && m<=em)){
    out.push(y+'-'+String(m).padStart(2,'0'));
    m++; if(m>12){m=1;y++;}
  }
  return out;
}
function statusPromocao(tecnicoId, mkAtual){
  const u=getUsuario(tecnicoId), nv=nivelDe(u);
  if(!nv.criterios) return null; // sênior, sem próximo nível
  const cicloFim = addMonths(u.cicloInicio, nv.cicloMeses);
  const meses = mesesEntre(u.cicloInicio, mkAtual).filter(mk=>mk <= monthKey(cicloFim) || mk===monthKey(cicloFim));
  let vezesMeta=0, vezesSuper=0, totalAt=0, totalInf=0, teveAdvertencia=false;
  meses.forEach(mk=>{
    const b=bonusMes(tecnicoId, mk);
    if(b.bateuMeta) vezesMeta++;
    if(b.bateuSuper) vezesSuper++;
    totalAt += qtdAtendimentosMes(tecnicoId, mk);
    totalInf += infracoesDoMes(tecnicoId, mk).length;
    infracoesDoMes(tecnicoId, mk).forEach(i=>{ if(i.gerouAdvertencia) teveAdvertencia=true; });
  });
  const percPenal = totalAt>0 ? (totalInf/totalAt)*100 : 0;
  const crit = nv.criterios;
  const itens = [
    {label:`Ficar ACIMA da meta pelo menos ${crit.minMetaVezes}x no ciclo`, ok: vezesMeta>=crit.minMetaVezes, atual:vezesMeta, alvo:crit.minMetaVezes},
    {label:`Atingir a supermeta pelo menos ${crit.minSupermetaVezes}x no ciclo`, ok: vezesSuper>=crit.minSupermetaVezes, atual:vezesSuper, alvo:crit.minSupermetaVezes},
    {label:`Não ultrapassar ${crit.maxPenalidadePerc}% de penalidades sobre atendimentos`, ok: percPenal<=crit.maxPenalidadePerc, atual:percPenal.toFixed(1)+'%', alvo:'≤ '+crit.maxPenalidadePerc+'%'},
    {label:'Nenhuma advertência formal no período', ok: !teveAdvertencia, atual: teveAdvertencia?'Houve advertência':'Sem advertência', alvo:'Sem advertência'}
  ];
  const elegivel = itens.every(i=>i.ok);
  return {itens, elegivel, cicloFim, proximo: state.niveis[nv.proximo]};
}

/* =====================================================================
   AUTENTICAÇÃO — Supabase
===================================================================== */

/* Busca profile + dados de técnico no Supabase e monta state.session
   no formato que o restante do código espera:
   { id, tipo, nome, nivel, ativo, dataAdmissao, cicloInicio }          */
async function buildSessionFromSupabase(supabaseUser) {
  const uid = supabaseUser.id;

  // 1. Buscar perfil
  const { data: profile, error: profErr } = await supabaseClient
    .from('profiles')
    .select('id, role, display_name, is_active')
    .eq('id', uid)
    .single();

  if (profErr || !profile) {
    throw new Error('Perfil não encontrado. Contate o administrador.');
  }
  if (!profile.is_active) {
    throw new Error('Conta desativada. Contate o administrador.');
  }

  const tipo = profile.role === 'admin' ? 'admin' : 'tecnico';

  // 2. Se for técnico, buscar dados específicos + nível
  let nivel = null, dataAdmissao = null, cicloInicio = null;
  if (tipo === 'tecnico') {
    const { data: tec, error: tecErr } = await supabaseClient
      .from('technicians')
      .select(`
        id,
        admission_date,
        cycle_start,
        career_levels ( key )
      `)
      .eq('id', uid)
      .single();

    if (tecErr || !tec) {
      throw new Error('Dados do técnico não encontrados. Contate o administrador.');
    }

    nivel        = tec.career_levels?.key ?? 'junior';
    dataAdmissao = tec.admission_date  ?? todayISO();
    cicloInicio  = tec.cycle_start     ?? todayISO();
  }

  // 3. Montar objeto no formato esperado pelo código existente
  const session = {
    id:           uid,
    tipo:         tipo,
    nome:         profile.display_name || supabaseUser.email,
    ativo:        profile.is_active,
    // campos exclusivos de técnico (null para admin — nenhum código os lê para admin)
    nivel:        nivel,
    dataAdmissao: dataAdmissao,
    cicloInicio:  cicloInicio
  };

  return session;
}

/* Busca a equipe real de técnicos no Supabase (profiles + technicians + nível)
   para o admin. Sem isso, Visão Geral / Bônus e Metas / Infrações mostravam os
   8 técnicos fictícios do código local (Técnico 1..8) em vez da equipe real. */
async function carregarTecnicosSupabase() {
  const { data: perfis, error: perfisErr } = await supabaseClient
    .from('profiles')
    .select('id, role, display_name, is_active')
    .eq('role', 'technician');
  if (perfisErr) throw perfisErr;

  const ids = (perfis || []).map(p => p.id);
  let tecnicosDb = [];
  if (ids.length) {
    const { data, error: tecErr } = await supabaseClient
      .from('technicians')
      .select('id, admission_date, cycle_start, career_levels ( key )')
      .in('id', ids);
    if (tecErr) throw tecErr;
    tecnicosDb = data || [];
  }
  const tecnicosPorId = {};
  tecnicosDb.forEach(t => { tecnicosPorId[t.id] = t; });

  const reais = (perfis || []).map(p => {
    const t = tecnicosPorId[p.id] || {};
    return {
      id: p.id,
      tipo: 'tecnico',
      nome: p.display_name || '(sem nome)',
      ativo: p.is_active !== false,
      nivel: t.career_levels?.key || 'junior',
      dataAdmissao: t.admission_date || todayISO(),
      cicloInicio: t.cycle_start || todayISO()
    };
  });

  if (reais.length) {
    state.usuarios = [state.session].concat(reais);
    state.tecnicosOrigem = 'supabase';
  } else {
    // Nenhum técnico real cadastrado no Supabase ainda: usa os 8 fictícios
    // locais só como ponto de partida para o admin editar nome/nível.
    // Editar aqui NÃO cria conta de login real — isso exige cadastrar o
    // técnico de verdade no Supabase (Authentication + tabelas profiles/technicians).
    state.usuarios = [state.session].concat(
      defaultUsuarios().filter(u => u.tipo === 'tecnico')
    );
    state.tecnicosOrigem = 'ficticio';
  }
}

/* Abre o app após obter state.session */
async function openApp() {
  if (state.session.tipo === 'admin') {
    try {
      await carregarTecnicosSupabase();
    } catch (e) {
      state.usuarios = [state.session];
      console.error('Falha ao carregar técnicos do Supabase:', e);
    }
  }
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  buildTabs();
  renderAll();
}

/* Login via Supabase Auth */
async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass  = document.getElementById('loginPass').value;
  const err   = document.getElementById('loginError');
  const btn   = document.getElementById('loginBtn');

  err.textContent = '';
  if (!email || !pass) { err.textContent = 'Preencha e-mail e senha.'; return; }

  btn.disabled    = true;
  btn.textContent = 'Entrando…';

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: pass });
    if (error) throw error;

    state.session = await buildSessionFromSupabase(data.user);
    await openApp();
  } catch (e) {
    err.textContent = e.message === 'Invalid login credentials'
      ? 'E-mail ou senha incorretos.'
      : (e.message || 'Erro ao entrar. Tente novamente.');
  } finally {
    btn.disabled    = false;
    btn.textContent = 'Entrar';
  }
}

/* Logout */
async function logout() {
  await supabaseClient.auth.signOut();
  state.session = null;
  document.getElementById('loginPass').value  = '';
  document.getElementById('loginEmail').value = '';
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
}

function painelRows(){
  const mk=state.mesRef;
  let rows = tecnicos().filter(u=>u.ativo).map(u=>{
    const nv=nivelDe(u);
    const qtd=qtdAtendimentosMes(u.id,mk);
    const prod=produtividadeMes(u.id,mk);
    const {bonus}=bonusMes(u.id,mk);
    const infTotal=penalidadesValorMes(u.id,mk);
    const liquido=remuneracaoEstimadaMes(u.id,mk);
    return {id:u.id, nome:u.nome, nivel:nv.nome, nivelKey:nv.key, equipamentos:qtd, produtividade:prod, bonus, infracoes:infTotal, liquido};
  });
  if(state.filtroPainel.nivel) rows=rows.filter(r=>r.nivelKey===state.filtroPainel.nivel);
  if(state.filtroPainel.tecnico) rows=rows.filter(r=>r.nome.toLowerCase().includes(state.filtroPainel.tecnico.toLowerCase()));
  const {col,dir}=state.sortPainel;
  rows.sort((a,b)=>{
    const va=a[col], vb=b[col];
    if(typeof va==='string') return dir==='asc' ? va.localeCompare(vb) : vb.localeCompare(va);
    return dir==='asc' ? va-vb : vb-va;
  });
  return rows;
}
function sortPainel(col){
  if(state.sortPainel.col===col) state.sortPainel.dir = state.sortPainel.dir==='asc'?'desc':'asc';
  else state.sortPainel={col,dir:'desc'};
  renderPainelTempoReal();

function downloadCSV(content, filename){
  const blob=new Blob(['﻿'+content], {type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}

function parseCSVText(text){
  text = text.replace(/^﻿/,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const firstLine = text.split('\n')[0];
  const delim = (firstLine.split(';').length > firstLine.split(',').length) ? ';' : ',';
  const lines=[]; let cur=[], field='', inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field+=c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===delim){ cur.push(field); field=''; }
      else if(c==='\n'){ cur.push(field); lines.push(cur); cur=[]; field=''; }
      else field+=c;
    }
  }
  if(field.length || cur.length){ cur.push(field); lines.push(cur); }
  const filtered = lines.filter(l=>l.some(v=>v.trim()!==''));
  if(!filtered.length) return {headers:[], rows:[]};
  const headers = filtered[0].map(h=>h.trim());
  const rows = filtered.slice(1).map(l=>{
    const obj={}; headers.forEach((h,idx)=>{ obj[h]=l[idx]!==undefined?l[idx].trim():''; }); return obj;
  });
  return {headers, rows};
}

function showImportError(msg){
  const el=document.getElementById('importArea');
  if(el) el.innerHTML = `<p class="danger-text small">${msg}</p>`;
}

function handleFile(ev){
  const file=ev.target.files[0]; if(!file) return;
  const nameLower=file.name.toLowerCase();
  document.getElementById('importArea').innerHTML = '<p class="small">Lendo arquivo...</p>';

  if(nameLower.endsWith('.csv')){
    const reader=new FileReader();
    reader.onload=function(e){
      try{
        const {headers, rows} = parseCSVText(e.target.result);
        if(!rows.length || !headers.length){ showImportError('Não foi possível identificar linhas e colunas no CSV. Confira se a primeira linha contém os títulos das colunas (ex: Técnico, Data, Equipamento).'); return; }
        state.pendingImport = {rows, headers};
        renderMapping();
      }catch(err){ showImportError('Erro ao ler o CSV: '+err.message); }
    };
    reader.onerror=function(){ showImportError('Não foi possível abrir o arquivo selecionado.'); };
    reader.readAsText(file, 'UTF-8');
    return;
  }

  if(typeof XLSX==='undefined'){
    showImportError('A biblioteca de leitura de planilhas (.xlsx) não carregou — provavelmente por falta de conexão com a internet neste momento. Exporte do Auvo em formato <b>.csv</b> (não depende dessa biblioteca) ou tente novamente em instantes.');
    return;
  }
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=new Uint8Array(e.target.result);
      const wb=XLSX.read(data, {type:'array', cellDates:true});
      const sheet=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(sheet, {defval:''});
      if(!rows.length){ showImportError('A planilha parece vazia.'); return; }
      state.pendingImport = {rows, headers:Object.keys(rows[0])};
      renderMapping();
    }catch(err){
      showImportError('Erro ao ler o arquivo ('+err.message+'). Tente reabrir e salvar a planilha novamente no Excel, ou exporte como .csv.');
    }
  };
  reader.onerror=function(){ showImportError('Não foi possível abrir o arquivo selecionado.'); };
  reader.readAsArrayBuffer(file);
}

function guessColumn(headers, keywords){
  const h=headers.find(h=>keywords.some(k=>h.toLowerCase().includes(k)));
  return h||headers[0];

      <tbody>${rows.slice(0,5).map(r=>`<tr>${headers.map(h=>`<td>${r[h]}</td>`).join('')}</tr>`).join('')}</tbody></table>
    </div>`;

function parseDateCell(v){
  if(v instanceof Date) return v.toISOString().slice(0,10);
  if(typeof v==='number'){ const d=XLSX.SSF.parse_date_code(v); if(d) return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`; }
  const s=String(v).trim();
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m) return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  return todayISO();
}

function renderTecnicoMatch(){
  const {rows, headers}=state.pendingImport;
  const colTec=document.getElementById('mapTec').value;
  const colData=document.getElementById('mapData').value;
  const colEquip=document.getElementById('mapEquip').value;
  state.pendingImport.cols={colTec, colData, colEquip};

  const uniqueNames=[...new Set(rows.map(r=>String(r[colTec]).trim()).filter(Boolean))];
  const tecs=tecnicos();
  function autoMatch(name){
    const lower=name.toLowerCase();
    let best=tecs.find(t=>t.nome.toLowerCase()===lower);
    if(!best) best=tecs.find(t=>lower.includes(t.nome.toLowerCase())||t.nome.toLowerCase().includes(lower));
    return best?best.id:'';
  }
  document.getElementById('importArea').innerHTML = `
    <hr class="sep">
    <p><b>Associe os nomes encontrados na planilha aos técnicos cadastrados:</b></p>
    ${uniqueNames.map(name=>`
      <div class="mapping-row">
        <span>${name}</span>
        <select id="match_${btoa(unescape(encodeURIComponent(name))).replace(/[^a-zA-Z0-9]/g,'')}" data-name="${name.replace(/"/g,'&quot;')}" class="tecMatch">
          <option value="">— ignorar linhas deste nome —</option>
          ${tecs.map(t=>`<option value="${t.id}" ${autoMatch(name)===t.id?'selected':''}>${t.nome}</option>`).join('')}
        </select>
      </div>`).join('')}
    <div style="margin-top:10px;"><button class="btn btn-primary" style="width:auto;" onclick="confirmImport()">Confirmar importação</button></div>
  `;
}

function confirmImport(){
  const {rows, cols}=state.pendingImport;
  const selects=[...document.querySelectorAll('.tecMatch')];
  const nameToId={};
  selects.forEach(s=>{ nameToId[s.dataset.name]=s.value; });
  let count=0;
  rows.forEach((r,idx)=>{
    const name=String(r[cols.colTec]).trim();
    const tecId=nameToId[name];
    if(!tecId) return;
    const dataISO=parseDateCell(r[cols.colData]);
    state.atendimentos.push({
      id:'at_'+Date.now()+'_'+idx,
      tecnicoId:tecId,
      data:dataISO,
      equipamento: cols.colEquip ? String(r[cols.colEquip]) : ''
    });
    count++;
  });
  state.pendingImport=null;
  alert(count+' atendimentos importados com sucesso.');
  renderAll();
}

  state.atendimentos = state.atendimentos.filter(a=>a.id!==id);

let atendimentosAutoTimer = null;
function ensureAtendimentosAutoRefresh(){
  const ativo = state.activeTab==='admin-liveatend' || state.activeTab==='tec-liveatend';
  if(ativo && !atendimentosAutoTimer && ATENDIMENTOS_SHEET_CSV_URL){
    atendimentosAutoTimer = setInterval(()=>carregarAtendimentosSheet(), ATENDIMENTOS_AUTO_REFRESH_MS);
  }
  if(!ativo && atendimentosAutoTimer){ clearInterval(atendimentosAutoTimer); atendimentosAutoTimer=null; }
}

function normTxt(s){
  return String(s||'').normalize('NFD').replace(/\p{Mn}/gu,'').toLowerCase().trim();
}
function getColByKeywords(headers, keywords){
  return headers.find(h=>keywords.some(k=>normTxt(h).includes(k))) || '';
}

/* Conta atendimentos por técnico no mês, somando todos os tipos de
   questionário (a planilha publicada só precisa ter Colaborador + Data da
   tarefa — nenhum dado sensível). */
function contarAtendimentosSheetPorTecnico_(linhas, headers, mesRef){
  const colColaborador = getColByKeywords(headers, ['colaborador','tecnico']);
  const colData = getColByKeywords(headers, ['data da tarefa','data']);
  const contagem = {};
  if(!colColaborador || !colData) return contagem;
  linhas.forEach(l=>{
    const dataTxt = String(l[colData]||'').trim();
    if(!dataTxt) return;
    if(monthKey(parseDateCell(dataTxt)) !== mesRef) return;
    const nome = String(l[colColaborador]||'').trim();
    if(!nome) return;
    const chave = normTxt(nome);
    if(!contagem[chave]) contagem[chave] = {nome, qtd:0};
    contagem[chave].qtd++;
  });
  return contagem;
}

async function carregarAtendimentosSheet(){
  const sheet = state.atendimentosSheet;
  if(!ATENDIMENTOS_SHEET_CSV_URL){ sheet.erro='not_configured'; return; }
  if(sheet.carregando) return;
  sheet.carregando = true; sheet.erro='';
  renderAll();
  try{
    const separador = ATENDIMENTOS_SHEET_CSV_URL.includes('?') ? '&' : '?';
    const resp = await fetch(ATENDIMENTOS_SHEET_CSV_URL + separador + 'cachebust=' + Date.now());
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    const text = await resp.text();
    const {headers, rows} = parseCSVText(text);
    if(!headers.length) throw new Error('A planilha publicada voltou vazia ou em formato inválido.');
    sheet.headers = headers;
    sheet.linhas = rows;
    sheet.atualizadoEm = new Date();
  }catch(err){
    sheet.erro = err.message || 'Falha ao buscar a planilha.';
  }finally{
    sheet.carregando = false;
    renderAll();
  }
}

function renderAtendimentosAuvo(main){
  const isAdmin = state.session.tipo==='admin';
  const sheet = state.atendimentosSheet;

  if(!ATENDIMENTOS_SHEET_CSV_URL){
    main.innerHTML = `
    <div class="section-head"><h2>Atendimentos (Auvo)</h2></div>
    <div class="card">
      <div class="empty-state">
        Esta aba ainda não foi conectada à planilha do Auvo.<br><br>
        No Google Sheets: crie uma aba só com as colunas <b>Colaborador</b> e
        <b>Data da tarefa</b> (junte aí as linhas de todos os tipos de atendimento) e publique
        essa aba em <b>Arquivo → Compartilhar → Publicar na Web</b> no formato <b>CSV</b>.
        Cole o link publicado na constante <span class="mono">ATENDIMENTOS_SHEET_CSV_URL</span>
        no topo do arquivo <span class="mono">index.html</span>.
      </div>
    </div>`;
    return;
  }

  if(!sheet.atualizadoEm && !sheet.carregando && sheet.erro!=='not_configured' && !sheet.erro){
    carregarAtendimentosSheet();
  }

  const atualizadoTxt = sheet.atualizadoEm
    ? sheet.atualizadoEm.toLocaleString('pt-BR')
    : (sheet.carregando ? 'Carregando…' : 'Ainda não carregado');

  main.innerHTML = `
  <div class="section-head">
    <h2>${isAdmin ? 'Atendimentos (Auvo)' : 'Meus atendimentos'}</h2>
    <div class="toolbar">
      ${mesSelectorHTML()}
      <span class="small">Atualizado em: ${atualizadoTxt}</span>
      <button class="btn" ${sheet.carregando?'disabled':''} onclick="carregarAtendimentosSheet()">${sheet.carregando?'Atualizando…':'Atualizar agora'}</button>
    </div>
  </div>
  ${sheet.erro && sheet.erro!=='not_configured' ? `<div class="card section"><p class="danger-text small" style="margin:0;">Não foi possível carregar a planilha: ${sheet.erro}</p></div>` : ''}
  <div id="atendAuvoContagem"></div>
  <p class="small" style="margin-top:8px;color:var(--muted);">
    Contagem de atendimentos (todos os tipos de questionário) vinda da planilha alimentada
    pela integração Auvo. O script atualiza a planilha uma vez por dia; esta tela também
    busca a planilha automaticamente a cada 5 minutos enquanto esta aba estiver aberta.
  </p>`;

  renderAtendimentosContagem();
}

function renderAtendimentosContagem(){
  const wrap=document.getElementById('atendAuvoContagem'); if(!wrap) return;
  const isAdmin = state.session.tipo==='admin';
  const sheet = state.atendimentosSheet;

  if(!sheet.headers || !sheet.headers.length){
    wrap.innerHTML = `<div class="card"><div class="empty-state">${sheet.carregando?'Carregando atendimentos…':'Nenhum dado carregado ainda.'}</div></div>`;
    return;
  }

  const contagem = contarAtendimentosSheetPorTecnico_(sheet.linhas, sheet.headers, state.mesRef);

  if(!isAdmin){
    const item = contagem[normTxt(state.session.nome)];
    wrap.innerHTML = `<div class="grid grid-4">
      <div class="card"><h3>Atendimentos no mês (Auvo)</h3>
        <div class="stat">${item ? item.qtd : 0}</div>
        <div class="stat-sub">${fmtMonthLabel(state.mesRef)} — todos os tipos de atendimento</div>
      </div>
    </div>`;
    return;
  }

  const linhas = Object.values(contagem).sort((a,b)=>b.qtd-a.qtd);
  wrap.innerHTML = `<div class="card table-wrap"><table>
    <thead><tr><th>Técnico</th><th class="num">Atendimentos no mês</th></tr></thead>
    <tbody>${linhas.length ? linhas.map(l=>`<tr><td>${l.nome}</td><td class="num">${l.qtd}</td></tr>`).join('')
      : `<tr><td colspan="2" class="empty-state">Nenhum atendimento encontrado para ${fmtMonthLabel(state.mesRef)}.</td></tr>`}</tbody>
  </table></div>`;
}

===================================================================== */
(async () => {
  // Tenta recuperar sessão já autenticada (token no storage do navegador)
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session?.user) {
    try {
      state.session = await buildSessionFromSupabase(session.user);
      await openApp();
    } catch (e) {
      // Perfil inválido ou desativado — força logout limpo
      await supabaseClient.auth.signOut();
    }
  }

  // Listener: mantém state.session sincronizado com eventos de auth
  // (token renovado, expirado, logout em outra aba, etc.)
  supabaseClient.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN' && session?.user && !state.session) {
      try {
        state.session = await buildSessionFromSupabase(session.user);
        await openApp();
      } catch (e) {
        await supabaseClient.auth.signOut();
      }
    }
    if (event === 'SIGNED_OUT') {
      state.session = null;
      document.getElementById('app').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
    }
    if (event === 'TOKEN_REFRESHED' && session?.user && state.session) {
      // Sessão renovada automaticamente — não precisa reabrir o app,
      // apenas garante que o usuário continua logado
    }
  });
})();
